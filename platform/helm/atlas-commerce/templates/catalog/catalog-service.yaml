{{- if .Values.catalog.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.catalog.service.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.catalog.labels.app }}
spec:
  type: {{ .Values.catalog.service.type }}
  selector:
    app: {{ .Values.catalog.labels.app }}
  ports:
    - name: http
      port: {{ .Values.catalog.service.port }}
      targetPort: {{ .Values.catalog.service.targetPort }}
{{- end }}