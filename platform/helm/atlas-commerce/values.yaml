auth:
  enabled: false

catalog:
  enabled: false

gateway:
  enabled: false

redis:
  enabled: false

kafka:
  enabled: false

postgres:
  enabled: false

cart:
  enabled: false  

pricing:
  enabled: false

coupon:
  enabled: false  

inventory:
  enabled: false  

payment:
  enabled: false  

order:
  enabled: false  

shipping:
  enabled: false  

notification:
  enabled: false  

audit:
  enabled: false

runtime:
  datasource:
    hikari:
      maximumPoolSize: 10
      minimumIdle: 1
      connectionTimeout: 30000  

ingress:
  enabled: false
  className: nginx
  host: atlas.local
  gatewayServiceName: gateway-service
  gatewayServicePort: 80
  annotations: {} 

secretManagement:
  createByHelm: true  

  externalSecrets:
    enabled: false
    refreshInterval: 1h

    secretStore:
      enabled: false
      name: aws-secrets-manager
      kind: ClusterSecretStore
      service: SecretsManager
      region: eu-central-1
      serviceAccountName: external-secrets
      serviceAccountNamespace: external-secrets

    secrets:
      jwt:
        enabled: true
        remoteKey: atlas/dev/jwt
        property: SECURITY_JWT_SECRET