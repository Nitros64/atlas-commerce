name: Gateway Service CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - "services/gateway-service/**"
      - ".github/workflows/reusable-service-ci.yml"
  pull_request:
    branches: [master, main, develop]
    paths:
      - "services/gateway-service/**"
      - ".github/workflows/reusable-service-ci.yml"

permissions:
  contents: read
  checks: write
  security-events: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and Test Gateway Service
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: Gateway Service
      service-path: services/gateway-service
      docker-image-name: gateway-service
    #secrets: inherit