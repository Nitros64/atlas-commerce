name: Catalog Service CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - "services/catalog-service/**"
      - ".github/workflows/reusable-service-ci.yml"
  pull_request:
    branches: [master, main, develop]
    paths:
      - "services/catalog-service/**"
      - ".github/workflows/reusable-service-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and Test Catalog Service
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: Catalog Service
      service-path: services/catalog-service
      docker-image-name: catalog-service
    #secrets: inherit
