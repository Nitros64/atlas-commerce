spring.application.name=inventory-service
server.port=8084

# Postgres - Local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/inventorydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:atlas}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:atlas}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Security
security.jwt.secret=${SECURITY_JWT_SECRET:atlas-commerce-dev-secret-1234567890}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

management.health.redis.enabled=false
management.health.rabbit.enabled=false
management.health.kafka.enabled=true

# Kafka - Local
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=inventory-service-local
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.listener.missing-topics-fatal=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.reconnect.backoff.ms=1000
spring.kafka.consumer.properties.reconnect.backoff.max.ms=10000

spring.kafka.consumer.properties.spring.json.value.default.type=com.atlascommerce.inventory_service.event.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*

atlas.kafka.topics.order-events=${ORDER_EVENTS_TOPIC:order-events}
atlas.kafka.topics.inventory-events=${INVENTORY_EVENTS_TOPIC:inventory-events}

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka.clients.consumer=WARN

# OpenTelemetry - Disabled locally
management.tracing.sampling.probability=0.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

management.opentelemetry.resource-attributes.service.namespace=atlas-local
management.opentelemetry.resource-attributes.service.name=inventory-service

# Resilience4j
resilience4j.circuitbreaker.instances.inventoryKafkaPublisher.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryKafkaPublisher.sliding-window-size=5
resilience4j.circuitbreaker.instances.inventoryKafkaPublisher.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.inventoryKafkaPublisher.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.inventoryKafkaPublisher.permitted-number-of-calls-in-half-open-state=2

resilience4j.retry.instances.inventoryKafkaPublisher.max-attempts=2
resilience4j.retry.instances.inventoryKafkaPublisher.wait-duration=500ms