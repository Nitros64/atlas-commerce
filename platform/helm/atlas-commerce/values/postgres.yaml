postgres:
  enabled: true

  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

  defaultStorageClassName: standard

  networkPolicy:
    enabled: true

  instances:
    auth:
      enabled: true
      name: postgres-auth
      secretName: postgres-auth-secret
      database: authdb
      username: atlas
      password: atlas
      replicas: 1
      storage: 2Gi
      resources:
        requests:
          cpu: "25m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
      allowedApps:
        - auth    

    catalog:
      enabled: true
      name: postgres-catalog
      secretName: postgres-catalog-secret
      database: catalogdb
      username: atlas
      password: atlas
      replicas: 1
      storage: 2Gi
      resources:
        requests:
          cpu: "25m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
      allowedApps:
        - catalog    

    cart:
      enabled: true
      name: postgres-cart
      secretName: postgres-cart-secret
      database: cartdb
      username: cart
      password: cart123
      replicas: 1
      storage: 2Gi
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"    
      allowedApps:
        - cart
        - postgres-backup     