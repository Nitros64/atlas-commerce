spring.application.name=auth-service
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:atlas}
#spring.data.redis.database=0

# Lettuce Pool Configuration
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=2000ms

# Redis Timeout
spring.data.redis.timeout=2000ms

# Logging Configuration
logging.level.io.netty=ERROR
logging.level.io.lettuce.core=WARN
logging.level.io.lettuce.core.protocol=ERROR
logging.level.io.lettuce.core.protocol.ConnectionWatchdog=ERROR
logging.level.io.lettuce.core.protocol.ReconnectionHandler=INFO
logging.level.io.lettuce.core.event=WARN

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] [%thread] %logger{36} - %msg%n

logging.level.org.springframework.data.redis=WARN
logging.level.org.springframework.boot.autoconfigure.data.redis=WARN

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted

# JWT Configuration
security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.expiration-ms=${SECURITY_JWT_EXPIRATION_MS}
security.jwt.refresh-expiration-ms=${SECURITY_JWT_REFRESH_EXPIRATION_MS}

# Session Management Configuration
security.session.max-active=${SECURITY_SESSION_MAX_ACTIVE:5}

# Rate Limiting Configuration
security.rate-limit.login.max-attempts=${SECURITY_RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
security.rate-limit.login.ip-max-attempts=${SECURITY_RATE_LIMIT_LOGIN_IP_MAX_ATTEMPTS:20}
security.rate-limit.login.window-seconds=${SECURITY_RATE_LIMIT_LOGIN_WINDOW_SECONDS:300}

# Forwarded Headers Configuration for Docker
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

