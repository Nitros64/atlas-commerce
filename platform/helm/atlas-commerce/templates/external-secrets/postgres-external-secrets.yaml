{{- if and .Values.secretManagement.externalSecrets.enabled .Values.secretManagement.externalSecrets.secrets.postgres.enabled }}
{{- range $key, $db := .Values.postgres.instances }}
{{- if $db.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $db.secretName }}-external
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: {{ $.Values.secretManagement.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $.Values.secretManagement.externalSecrets.secretStore.name }}
    kind: ClusterSecretStore
  target:
    name: {{ $db.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        POSTGRES_USER: {{ $db.username | quote }}
        POSTGRES_PASSWORD: {{ "{{ .postgresPassword }}" | quote }}
        POSTGRES_DB: {{ $db.database | quote }}
  data:
    - secretKey: postgresPassword
      remoteRef:
        key: {{ $.Values.secretManagement.externalSecrets.secrets.postgres.remoteKey | quote }}
        property: {{ $.Values.secretManagement.externalSecrets.secrets.postgres.passwordProperty | quote }}
{{- end }}
{{- end }}
{{- end }}