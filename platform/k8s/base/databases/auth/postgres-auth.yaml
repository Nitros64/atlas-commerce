apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-auth
  namespace: atlas
spec:
  selector:
    matchLabels:
      app: postgres-auth 
  serviceName: postgres-auth-headless
  replicas: 1 
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app: postgres-auth
    spec:      
      terminationGracePeriodSeconds: 10
      containers:
      - name: postgres-auth
        imagePullPolicy: IfNotPresent
        image: postgres:16
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: "25m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"  
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-auth-secret
              key: POSTGRES_DB

        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-auth-secret
              key: POSTGRES_USER

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth-secret
              key: POSTGRES_PASSWORD

        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U atlas -d authdb
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U atlas -d authdb
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6   
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard # default storage class in minikube
      resources:
        requests:
          storage: 2Gi