name: Notification Service CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - "services/notification-service/**"
      - ".github/workflows/reusable-service-ci.yml"
  pull_request:
    branches: [master, main, develop]
    paths:
      - "services/notification-service/**"
      - ".github/workflows/reusable-service-ci.yml"

permissions:
  contents: read
  checks: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and Test Notification Service
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: Notification Service
      service-path: services/notification-service
      docker-image-name: notification-service
    secrets: inherit