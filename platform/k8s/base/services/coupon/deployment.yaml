apiVersion: apps/v1
kind: Deployment
metadata:
  name: coupon
  namespace: atlas
  labels:
    app: coupon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coupon
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: coupon
        component: backend
    spec:
      containers:
        - name: coupon
          image: nitros64/coupon-service:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8087
              name: http
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=35.0
                -XX:InitialRAMPercentage=8.0
                -XX:MaxMetaspaceSize=128m     
          envFrom:
            - configMapRef:
                name: coupon-config
            - secretRef:
                name: postgres-coupon-secret
            - secretRef:
                name: jwt-secret
          
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8087
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8087
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"