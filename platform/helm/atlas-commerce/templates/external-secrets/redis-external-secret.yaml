{{- if and .Values.secretManagement.externalSecrets.enabled .Values.secretManagement.externalSecrets.secrets.redis.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-secret-external
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.secretManagement.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.secretManagement.externalSecrets.secretStore.name }}
    kind: ClusterSecretStore
  target:
    name: redis-secret
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.secretManagement.externalSecrets.secrets.redis.remoteKey | quote }}
        property: {{ .Values.secretManagement.externalSecrets.secrets.redis.property | quote }}
{{- end }}