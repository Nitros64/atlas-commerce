apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  namespace: atlas
  labels:
    app: audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: audit
        component: backend
    spec:
      containers:
        - name: audit
          image: nitros64/audit-service:1.0.2
          imagePullPolicy: Always
          ports:
            - containerPort: 8093
              name: http
          env:
          - name: JAVA_TOOL_OPTIONS
            value: >-
              -XX:+UseContainerSupport
              -XX:MaxRAMPercentage=35.0
              -XX:InitialRAMPercentage=8.0
              -XX:MaxMetaspaceSize=128m   
          envFrom:
            - configMapRef:
                name: audit-config
            - secretRef:
                name: postgres-audit-secret
            - secretRef:
                name: jwt-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8093
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8093
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8093
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
