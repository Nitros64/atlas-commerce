# Install ESO CRDs together with the Helm release.
installCRDs: true

# This ServiceAccount must match the IRSA trust policy created by Terraform.
serviceAccount:
  create: true
  name: external-secrets

# No token impersonation is needed because ESO uses its own IRSA identity.
rbac:
  serviceAccountTokenCreate: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 192Mi

certController:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 192Mi