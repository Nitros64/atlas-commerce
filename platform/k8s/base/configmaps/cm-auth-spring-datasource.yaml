apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-auth-spring-datasource
  namespace: atlas
data:
  # Database connection properties PostgreSQL
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/authdb
  SPRING_DATASOURCE_USERNAME: atlas
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

  # HikariCP connection pool properties
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"
  SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: "1000"
  SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: "30000"
  SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "300000"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"