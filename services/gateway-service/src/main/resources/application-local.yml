server:
  port: 8080

spring:
  application:
    name: gateway-service

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:atlas-redis-pass}
      connect-timeout: 10s
      timeout: 10s

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - StripPrefix=0
                - name: RequestRateLimiter
                  args:
                    keyResolver: "#{@ipKeyResolver}"
                    rateLimiter: "#{@redisRateLimiter}"

            - id: catalog-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/catalog/**

            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/orders/**

            - id: inventory-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/inventory/**

            - id: payment-service
              uri: http://localhost:8088
              predicates:
                - Path=/api/v1/payments/**

            - id: shipping-service
              uri: http://localhost:8089
              predicates:
                - Path=/api/v1/shipping/**

            - id: notification-service
              uri: http://localhost:8091
              predicates:
                - Path=/api/v1/notifications/**

            - id: audit-service
              uri: http://localhost:8093
              predicates:
                - Path=/api/v1/audit-events/**

            - id: auth-openapi
              uri: http://localhost:8081
              predicates:
                - Path=/auth/v3/api-docs
              filters:
                - StripPrefix=1

            - id: catalog-openapi
              uri: http://localhost:8082
              predicates:
                - Path=/catalog/v3/api-docs
              filters:
                - StripPrefix=1

            - id: order-openapi
              uri: http://localhost:8083
              predicates:
                - Path=/order/v3/api-docs
              filters:
                - StripPrefix=1

            - id: inventory-openapi
              uri: http://localhost:8084
              predicates:
                - Path=/inventory/v3/api-docs
              filters:
                - StripPrefix=1

            - id: payment-openapi
              uri: http://localhost:8088
              predicates:
                - Path=/payment/v3/api-docs
              filters:
                - StripPrefix=1

            - id: shipping-openapi
              uri: http://localhost:8089
              predicates:
                - Path=/shipping/v3/api-docs
              filters:
                - StripPrefix=1

            - id: notification-openapi
              uri: http://localhost:8091
              predicates:
                - Path=/notification/v3/api-docs
              filters:
                - StripPrefix=1

            - id: audit-openapi
              uri: http://localhost:8093
              predicates:
                - Path=/audit/v3/api-docs
              filters:
                - StripPrefix=1

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:atlas-commerce-dev-secret-1234567890}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  health:
    redis:
      enabled: false
    probes:
      enabled: false

  tracing:
    sampling:
      probability: 0.0

  otlp:
    metrics:
      export:
        enabled: false

  metrics:
    export:
      otlp:
        enabled: false    

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    resource-attributes:
      service:
        namespace: atlas-local
        name: gateway-service

springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /auth/v3/api-docs
      - name: catalog-service
        url: /catalog/v3/api-docs
      - name: order-service
        url: /order/v3/api-docs
      - name: inventory-service
        url: /inventory/v3/api-docs
      - name: payment-service
        url: /payment/v3/api-docs
      - name: shipping-service
        url: /shipping/v3/api-docs
      - name: notification-service
        url: /notification/v3/api-docs
      - name: audit-service
        url: /audit/v3/api-docs