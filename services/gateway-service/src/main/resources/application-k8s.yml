server:
  port: 8080

spring:
  application:
    name: gateway-service

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      connect-timeout: 10s
      timeout: 10s

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://auth-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
              - StripPrefix=0
              - name: RequestRateLimiter
                args:
                  keyResolver: "#{@ipKeyResolver}"
                  rateLimiter: "#{@redisRateLimiter}"   
            - id: catalog-service
              uri: http://catalog-service
              predicates:
                - Path=/api/v1/catalog/**

            - id: order-service
              uri: http://order-service
              predicates:
                - Path=/api/v1/orders/**      

            - id: inventory-service
              uri: http://inventory-service
              predicates:
                - Path=/api/v1/inventory/**    

            - id: cart-service
              uri: http://cart-service
              predicates:
                - Path=/api/v1/carts/**    

            - id: pricing-service
              uri: http://pricing-service
              predicates:
                - Path=/api/v1/pricing/**    

            - id: coupon-service
              uri: http://coupon-service
              predicates:
                - Path=/api/v1/coupons/**    

            - id: payment-service
              uri: http://payment-service
              predicates:
                - Path=/api/v1/payments/**    

            - id: shipping-service
              uri: http://shipping-service
              predicates:
                - Path=/api/v1/shipping/**    

            - id: notification-service
              uri: http://notification-service
              predicates:
                - Path=/api/v1/notifications/**    

            - id: audit-service
              uri: http://audit-service
              predicates:
                - Path=/api/v1/audit-events/**    

            - id: auth-openapi
              uri: http://auth-service
              predicates:
                - Path=/auth/v3/api-docs
              filters:
                - StripPrefix=1

            - id: catalog-openapi
              uri: http://catalog-service
              predicates:
                - Path=/catalog/v3/api-docs
              filters:
                - StripPrefix=1

            - id: order-openapi
              uri: http://order-service
              predicates:
                - Path=/order/v3/api-docs
              filters:
                - StripPrefix=1

            - id: inventory-openapi
              uri: http://inventory-service
              predicates:
                - Path=/inventory/v3/api-docs
              filters:
                - StripPrefix=1

            - id: cart-openapi
              uri: http://cart-service
              predicates:
                - Path=/cart/v3/api-docs
              filters:
                - StripPrefix=1

            - id: coupon-openapi
              uri: http://coupon-service
              predicates:
                - Path=/coupon/v3/api-docs
              filters:
                - StripPrefix=1

            - id: payment-openapi
              uri: http://payment-service
              predicates:
                - Path=/payment/v3/api-docs
              filters:
                - StripPrefix=1

            - id: shipping-openapi
              uri: http://shipping-service
              predicates:
                - Path=/shipping/v3/api-docs
              filters:
                - StripPrefix=1

            - id: notification-openapi
              uri: http://notification-service
              predicates:
                - Path=/notification/v3/api-docs
              filters:
                - StripPrefix=1

            - id: audit-openapi
              uri: http://audit-service
              predicates:
                - Path=/audit/v3/api-docs
              filters:
                - StripPrefix=1   

            - id: pricing-openapi
              uri: http://pricing-service
              predicates:
                - Path=/pricing/v3/api-docs
              filters:
                - StripPrefix=1     

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}    
      
logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  health:
    redis:
        enabled: false
    probes:
      enabled: false

  tracing:
    sampling:
      probability: 1.0    

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://tempo:4318/v1/traces
    resource-attributes:
      service:
        namespace: atlas
        name: gateway-service    

springdoc:
  swagger-ui:
    urls:
      - name: /auth-service
        url: /auth/v3/api-docs
      - name: /catalog-service
        url: /catalog/v3/api-docs
      - name: order-service
        url: /order/v3/api-docs
      - name: inventory-service
        url: /inventory/v3/api-docs
      - name: cart-service
        url: /cart/v3/api-docs
      - name: coupon-service
        url: /coupon/v3/api-docs
      - name: payment-service
        url: /payment/v3/api-docs
      - name: shipping-service
        url: /shipping/v3/api-docs
      - name: notification-service
        url: /notification/v3/api-docs
      - name: audit-service
        url: /audit/v3/api-docs 
      - name: /pricing-service
        url: /pricing/v3/api-docs         