coupon:
  enabled: true

  deployment:
    name: coupon
    replicas: 1
    image:
      repository: nitros64/coupon-service
      tag: "1.0.1"
      pullPolicy: Always
    containerPort: 8087
    terminationGracePeriodSeconds: 30

  labels:
    app: coupon
    tier: backend
    version: v1

  service:
    name: coupon-service
    type: ClusterIP
    port: 80
    targetPort: 8087

  javaToolOptions: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=35.0
    -XX:InitialRAMPercentage=8.0
    -XX:MaxMetaspaceSize=128m

  datasource:
    url: jdbc:postgresql://postgres-coupon:5432/coupondb
    driverClassName: org.postgresql.Driver
    ddlAuto: validate

  management:
    healthProbesEnabled: "true"
    healthShowDetails: always
    healthRedisEnabled: "false"
    healthRabbitEnabled: "false"
    healthKafkaEnabled: "false"

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  probes:
    startup:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 30
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6

  networkPolicy:
    enabled: true
    allowedIngressApps:
      - gateway
      - cart
      - order
      - prometheus