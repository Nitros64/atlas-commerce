apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: atlas
  labels:
    app: auth
    tier: backend
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
        tier: backend
        version: v1
    spec:      
      terminationGracePeriodSeconds: 30      
      containers:
      - name: auth
        image: nitros64/auth-service:1.0.9
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        env:
          - name: JAVA_TOOL_OPTIONS
            value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=25.0"  
        envFrom:
          - configMapRef: #DB
              name: cm-auth-spring-datasource
          - configMapRef:
              name: cm-redis    
          - configMapRef:
              name: cm-auth 
          - secretRef:
              name: auth-secret      
          - secretRef:
              name: jwt-secret
          - secretRef:
              name: redis-secret       
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false            
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
            
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081 
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6  
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]  
