spring.application.name=auth-service

spring.datasource.url=jdbc:h2:mem:auth_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

spring.data.redis.repositories.enabled=false

security.jwt.secret=test-secret-key-test-secret-key-test-secret-key-test-secret-key
security.jwt.expiration-ms=900000
security.jwt.refresh-expiration-ms=604800000

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true