{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.gateway.deployment.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  labels:
    app: {{ .Values.gateway.labels.app }}
spec:
  replicas: {{ .Values.gateway.deployment.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ .Values.gateway.labels.app }}
  template:
    metadata:
      annotations:
        checksum/secret-jwt: {{ include (print $.Template.BasePath "/jwt/secret.yaml") . | sha256sum }}
        checksum/secret-redis: {{ include (print $.Template.BasePath "/redis/redis-secret.yaml") . | sha256sum }}
      labels:
        app: {{ .Values.gateway.labels.app }}
        tier: {{ .Values.gateway.labels.tier }}
        version: {{ .Values.gateway.labels.version }}
    spec:
      containers:
        - name: {{ .Values.gateway.labels.app }}
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.gateway.deployment.image.repository }}:{{ .Values.gateway.deployment.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.deployment.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.gateway.deployment.containerPort }}

          envFrom:
            - secretRef:
                name: {{ .Values.gateway.env.jwtSecretName }}

          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.gateway.javaToolOptions | quote }}

            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.gateway.env.springProfilesActive | quote }}

            - name: SPRING_DATA_REDIS_HOST
              value: {{ .Values.gateway.env.redisHost | quote }}

            - name: SPRING_DATA_REDIS_PORT
              value: {{ .Values.gateway.env.redisPort | quote }}

            - name: SPRING_DATA_REDIS_SSL_ENABLED
              value: {{ .Values.redis.external.sslEnabled | default false | quote }}  

            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.env.redisSecretName }}
                  key: REDIS_PASSWORD

            - name: OTEL_SDK_DISABLED
              value: {{ .Values.gateway.env.otelSdkDisabled | quote }}

            - name: OTEL_TRACES_EXPORTER
              value: {{ .Values.gateway.env.otelTracesExporter | quote }}

            - name: OTEL_METRICS_EXPORTER
              value: {{ .Values.gateway.env.otelMetricsExporter | quote }}

            - name: OTEL_LOGS_EXPORTER
              value: {{ .Values.gateway.env.otelLogsExporter | quote }}

            - name: MANAGEMENT_TRACING_ENABLED
              value: {{ .Values.gateway.env.managementTracingEnabled | quote }}

            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: {{ .Values.gateway.env.managementOtlpMetricsExportEnabled | quote }}

            - name: MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED
              value: {{ .Values.gateway.env.managementOtlpTracingExportEnabled | quote }}

            - name: MANAGEMENT_TRACING_EXPORT_ENABLED
              value: {{ .Values.gateway.env.managementTracingExportEnabled | quote }}

            - name: MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED
              value: {{ .Values.gateway.env.managementTracingExportOtlpEnabled | quote }}

            - name: MANAGEMENT_LOGGING_EXPORT_ENABLED
              value: {{ .Values.gateway.env.managementLoggingExportEnabled | quote }}

            - name: MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED
              value: {{ .Values.gateway.env.managementLoggingExportOtlpEnabled | quote }}  

          resources:
            requests:
              memory: {{ .Values.gateway.resources.requests.memory | quote }}
              cpu: {{ .Values.gateway.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.gateway.resources.limits.memory | quote }}
              cpu: {{ .Values.gateway.resources.limits.cpu | quote }}

          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.gateway.deployment.containerPort }}
            initialDelaySeconds: {{ .Values.gateway.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.gateway.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.gateway.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.gateway.probes.startup.failureThreshold }}

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.gateway.deployment.containerPort }}
            initialDelaySeconds: {{ .Values.gateway.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.gateway.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.gateway.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.gateway.probes.liveness.failureThreshold }}

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.gateway.deployment.containerPort }}
            initialDelaySeconds: {{ .Values.gateway.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.gateway.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.gateway.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.gateway.probes.readiness.failureThreshold }}
{{- end }}
