catalog:
  enabled: true

  deployment:
    name: catalog
    replicas: 1
    image:
      repository: nitros64/catalog-service
      tag: "1.0.6"
      pullPolicy: Always
    containerPort: 8082
    terminationGracePeriodSeconds: 30

  labels:
    app: catalog
    tier: backend
    version: v1

  service:
    name: catalog-service
    type: ClusterIP
    port: 80
    targetPort: 8082

  javaToolOptions: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=35.0
    -XX:InitialRAMPercentage=8.0
    -XX:MaxMetaspaceSize=128m

  datasource:
    url: jdbc:postgresql://postgres-catalog:5432/catalogdb
    driverClassName: org.postgresql.Driver

  redis:
    host: redis
    port: "6379"
    secretName: redis-secret

  jwt:
    secretName: jwt-secret

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  probes:
    startup:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 30
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6