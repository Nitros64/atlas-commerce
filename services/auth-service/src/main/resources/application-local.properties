spring.application.name=auth-service
server.port=8081

# Database - Local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:atlas}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:atlas}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# Hikari - Local
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=INFO

# Redis - Local
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:atlas}

# Lettuce Pool - Local
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=2000ms
spring.data.redis.timeout=2000ms

# Logging
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] [%thread] %logger{36} - %msg%n

logging.level.io.netty=ERROR
logging.level.io.lettuce.core=WARN
logging.level.io.lettuce.core.protocol=ERROR
logging.level.io.lettuce.core.protocol.ConnectionWatchdog=ERROR
logging.level.io.lettuce.core.protocol.ReconnectionHandler=INFO
logging.level.io.lettuce.core.event=WARN

logging.level.org.springframework.data.redis=WARN
logging.level.org.springframework.boot.autoconfigure.data.redis=WARN

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted

management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# JWT - Local
security.jwt.secret=${SECURITY_JWT_SECRET:dev-local-secret-change-me}
security.jwt.expiration-ms=${SECURITY_JWT_EXPIRATION_MS:3600000}
security.jwt.refresh-expiration-ms=${SECURITY_JWT_REFRESH_EXPIRATION_MS:86400000}

# Session Management
security.session.max-active=${SECURITY_SESSION_MAX_ACTIVE:5}

# Rate Limiting
security.rate-limit.login.max-attempts=${SECURITY_RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
security.rate-limit.login.ip-max-attempts=${SECURITY_RATE_LIMIT_LOGIN_IP_MAX_ATTEMPTS:20}
security.rate-limit.login.window-seconds=${SECURITY_RATE_LIMIT_LOGIN_WINDOW_SECONDS:300}

# Forwarded Headers - Local
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}