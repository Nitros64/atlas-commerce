pricing:
  enabled: true

  deployment:
    name: pricing
    replicas: 1
    image:
      repository: nitros64/pricing-service
      tag: "1.0.1"
      pullPolicy: Always
    containerPort: 8086
    terminationGracePeriodSeconds: 30

  labels:
    app: pricing
    tier: backend
    version: v1

  service:
    name: pricing-service
    type: ClusterIP
    port: 80
    targetPort: 8086

  javaToolOptions: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=35.0
    -XX:InitialRAMPercentage=8.0
    -XX:MaxMetaspaceSize=128m

  management:
    healthProbesEnabled: "true"
    healthShowDetails: always

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  probes:
    startup:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 30
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6

  networkPolicy:
    enabled: true
    allowedIngressApps:
      - gateway
      - catalog
      - cart
      - order
      - prometheus