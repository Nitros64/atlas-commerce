spring.application.name=audit-service
server.port=${SERVER_PORT:8093}

security.jwt.secret=${SECURITY_JWT_SECRET:dev-local-secret-change-me}

# Postgres - Local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5439/auditdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:atlas}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:atlas}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

management.health.redis.enabled=false
management.health.rabbit.enabled=false
management.health.kafka.enabled=false

# Kafka - Local
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=audit-service-local
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

atlas.kafka.topics.order-events=${ORDER_EVENTS_TOPIC:order-events}
atlas.kafka.topics.inventory-events=${INVENTORY_EVENTS_TOPIC:inventory-events}
atlas.kafka.topics.payment-events=${PAYMENT_EVENTS_TOPIC:payment-events}
atlas.kafka.topics.shipping-events=${SHIPPING_EVENTS_TOPIC:shipping-events}

# Logging
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE