auth:
  enabled: true

  deployment:
    name: auth
    replicas: 1
    image: nitros64/auth-service:1.0.15
    imagePullPolicy: Always
    containerPort: 8081
    terminationGracePeriodSeconds: 30

  labels:
    app: auth
    tier: backend
    version: v1

  service:
    name: auth-service
    type: ClusterIP
    port: 80
    targetPort: 8081

  javaToolOptions: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=35.0
    -XX:InitialRAMPercentage=8.0
    -XX:MaxMetaspaceSize=128m

  datasource:
    url: jdbc:postgresql://postgres-auth:5432/authdb
    username: atlas
    password: atlas
    driverClassName: org.postgresql.Driver
    hikari:
      connectionTimeout: "3000"
      validationTimeout: "1000"
      idleTimeout: "30000"
      maxLifetime: "300000"
      maximumPoolSize: "10"
      minimumIdle: "2"

  jwt:
    secret: "9P6jcBxWjc9PSAyV5kL21aA6Y1Y1ijlcONXazdXRWf+UHWJWpjPj7nlWTHq0fjKSOKJyt9NaV7Z7AQmW60B2D2hjd9m3/emdO5Aa7aNjVxpzKWvld6EepPDWlTsfpV4l"
    expirationMs: "300000"
    refreshExpirationMs: "604800000"

  security:
    sessionMaxActive: "5"
    loginMaxAttempts: "5"
    loginWindowSeconds: "300"

  server:
    forwardHeadersStrategy: framework

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  probes:
    startup:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 30
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6

  pdb:
    enabled: true
    minAvailable: 1

postgres:
  auth:
    enabled: true
    name: postgres-auth
    image: postgres:16
    imagePullPolicy: IfNotPresent
    replicas: 1
    database: authdb
    username: atlas
    password: atlas
    secretName: postgres-auth-secret
    service:
      port: 5432
      targetPort: 5432
    persistence:
      enabled: true
      storageClassName: standard
      size: 2Gi
    resources:
      requests:
        cpu: "25m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

redis:
  enabled: true
  name: redis
  image: redis:7-alpine
  imagePullPolicy: IfNotPresent
  replicas: 1
  password: atlas-redis-pass
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"  

gateway:
  enabled: true

  deployment:
    name: gateway
    replicas: 1
    image: nitros64/api-gateway:1.0.26
    imagePullPolicy: Always
    containerPort: 8080

  labels:
    app: gateway
    tier: backend
    version: v1

  service:
    name: gateway-service
    type: ClusterIP
    port: 80
    targetPort: 8080

  javaToolOptions: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=35.0
    -XX:InitialRAMPercentage=8.0
    -XX:MaxMetaspaceSize=128m

  env:
    springProfilesActive: k8s
    redisHost: redis
    redisPort: "6379"
    redisSecretName: redis-secret
    jwtSecretName: jwt-secret
    managementHealthRedisEnabled: "false"

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  probes:
    startup:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 45
    liveness:
      initialDelaySeconds: 180
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 5
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6      