apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: atlas
  labels:
    app: cart
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
        component: backend
    spec:
      containers:
        - name: cart
          image: nitros64/cart-service:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
              name: http
          env:
          - name: JAVA_TOOL_OPTIONS
            value: >-
              -XX:+UseContainerSupport
              -XX:MaxRAMPercentage=35.0
              -XX:InitialRAMPercentage=8.0
              -XX:MaxMetaspaceSize=128m     
          envFrom:
            - configMapRef:
                name: cart-config
            - secretRef:
                name: cart-secret
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"