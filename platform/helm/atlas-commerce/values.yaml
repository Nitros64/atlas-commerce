global:
  imageRegistry: ""

auth:
  enabled: false

catalog:
  enabled: false

gateway:
  enabled: false

redis:
  enabled: false
  external:
    enabled: false
    host: ""
    port: 6379
    sslEnabled: false

kafka:
  enabled: false

postgres:
  enabled: false
  networkPolicy:
    enabled: false
  instances: {}
  external:
    enabled: false
    host: ""
    port: 5432
  bootstrap:
    enabled: false
    adminSecret:
      remoteKey: ""

cart:
  enabled: false  

pricing:
  enabled: false

coupon:
  enabled: false  

inventory:
  enabled: false  

payment:
  enabled: false  

order:
  enabled: false  

shipping:
  enabled: false  

notification:
  enabled: false  

audit:
  enabled: false

runtime:
  datasource:
    hikari:
      maximumPoolSize: 10
      minimumIdle: 1
      connectionTimeout: 30000  

ingress:
  enabled: false
  className: nginx
  host: atlas.local
  gatewayServiceName: gateway-service
  gatewayServicePort: 80
  annotations: {} 

secretManagement:
  createByHelm: false

  externalSecrets:
    enabled: false
    refreshInterval: 1h

    secretStore:
      enabled: false
      name: aws-secrets-manager
      kind: ClusterSecretStore
      service: SecretsManager
      region: eu-central-1
      serviceAccountName: external-secrets
      serviceAccountNamespace: external-secrets

    secrets:
      jwt:
        enabled: true
        remoteKey: atlas/dev/jwt
        property: SECURITY_JWT_SECRET
      postgres:
        enabled: false
        remoteKey: ""
        passwordProperty: POSTGRES_PASSWORD
      redis:
        enabled: false
        remoteKey: ""
        property: REDIS_PASSWORD

secrets:
  jwt:
    name: jwt-secret
    value: ""
