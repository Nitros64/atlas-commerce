# AWS development uses managed RDS and ElastiCache.
# Secrets are synchronized by External Secrets Operator.

secretManagement:
  createByHelm: false

  externalSecrets:
    enabled: true
    refreshInterval: 1h

    secretStore:
      enabled: true
      name: aws-secrets-manager
      kind: ClusterSecretStore
      service: SecretsManager
      region: eu-central-1
      serviceAccountName: external-secrets
      serviceAccountNamespace: external-secrets

    secrets:
      jwt:
        enabled: true
        remoteKey: atlas-commerce/dev/platform
        property: SECURITY_JWT_SECRET

      postgres:
        enabled: true
        remoteKey: atlas-commerce/dev/platform
        passwordProperty: POSTGRES_PASSWORD  

      redis:
        enabled: true
        remoteKey: atlas-commerce/dev/platform
        property: REDIS_PASSWORD  

# These names are references only; no secret values live in Git.
secrets:
  jwt:
    name: jwt-secret  

postgres:
  enabled: false

  external:
    enabled: true
    host: ""
    port: 5432

  bootstrap:
    enabled: true
    image: postgres:17-alpine
    backoffLimit: 3

    secretWait:
      image: curlimages/curl:8.12.1
      timeoutSeconds: 180
      intervalSeconds: 5

    adminSecret:
      name: postgres-admin-secret
      remoteKey: ""
      usernameProperty: username
      passwordProperty: password

    appPasswordSecretName: postgres-auth-secret
    appPasswordSecretKey: POSTGRES_PASSWORD  

runtime:
  datasource:
    hikari:
      maximumPoolSize: 4
      minimumIdle: 0
      connectionTimeout: 60000

auth:
  datasource:
    hikari:
      maximumPoolSize: 4
      minimumIdle: 0
      connectionTimeout: 60000    

# REDIS
redis:
  enabled: false

  external:
    enabled: true
    host: ""
    port: "6379"  
    sslEnabled: true

# KAFKA    
kafka:
  pvc:
    storageClassName: gp2

# DEV has no ingress controller. Operators access the ClusterIP gateway with
# port-forward; no public LoadBalancer is created.
ingress:
  enabled: false
