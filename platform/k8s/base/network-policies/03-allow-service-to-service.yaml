apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-service-to-service
  namespace: atlas
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - auth
          - catalog
          - order
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - auth
                  - catalog
                  - order
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083