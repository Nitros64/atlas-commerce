name: Payment Service CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - "services/payment-service/**"
      - ".github/workflows/reusable-service-ci.yml"
  pull_request:
    branches: [master, main, develop]
    paths:
      - "services/payment-service/**"
      - ".github/workflows/reusable-service-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and Test Payment Service
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: Payment Service
      service-path: services/payment-service
      docker-image-name: payment-service
    #secrets: inherit
