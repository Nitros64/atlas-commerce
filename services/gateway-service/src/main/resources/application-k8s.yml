server:
  port: 8080

spring:
  application:
    name: gateway-service

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      connect-timeout: 10s
      timeout: 10s

  

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://auth-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
              - StripPrefix=0
              - name: RequestRateLimiter
                args:
                  keyResolver: "#{@ipKeyResolver}"
                  rateLimiter: "#{@redisRateLimiter}"   
            - id: catalog-service
              uri: http://catalog-service
              predicates:
                - Path=/api/v1/catalog/**

            - id: order-service
              uri: http://order-service
              predicates:
                - Path=/api/v1/orders/**      

            - id: inventory-service
              uri: http://inventory-service
              predicates:
                - Path=/api/v1/inventory/**    

            - id: cart-service
              uri: http://cart-service
              predicates:
                - Path=/api/v1/carts/**    

            - id: pricing-service
              uri: http://pricing-service
              predicates:
                - Path=/api/v1/pricing/**    

            - id: coupon-service
              uri: http://coupon-service
              predicates:
                - Path=/api/v1/coupons/**    

            - id: payment-service
              uri: http://payment-service
              predicates:
                - Path=/api/v1/payments/**    

            - id: shipping-service
              uri: http://shipping-service
              predicates:
                - Path=/api/v1/shipping/**    

            - id: notification-service
              uri: http://notification-service
              predicates:
                - Path=/api/v1/notifications/**    

            - id: audit-service
              uri: http://audit-service
              predicates:
                - Path=/api/v1/audit-events/**    

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}    
      
logging:
  level:
    org.springframework.cloud.gateway: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  health:
    redis:
        enabled: false
    probes:
      enabled: false