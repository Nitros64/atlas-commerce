apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: atlas
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        tier: messaging
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:     
        fsGroup: 1000 
      initContainers:
      - name: kafka-volume-permissions
        image: busybox:1.36
        command:
          - sh
          - -c
          - chown -R 1000:1000 /var/lib/kafka/data
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: kafka-data
            mountPath: /var/lib/kafka/data  
      containers:
      - name: kafka
        image: apache/kafka:4.0.0
        imagePullPolicy: IfNotPresent

        ports:
          - containerPort: 9092
            name: broker
          - containerPort: 9093
            name: controller

        envFrom:
          - configMapRef:
              name: kafka-broker-config
        
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000      
        resources:
          requests:
            cpu: "500m"
            memory: "768Mi"
          limits:
            cpu: "1500m"
            memory: "2Gi"

        volumeMounts:
          - name: kafka-data
            mountPath: /var/lib/kafka/data

        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6

        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 5

        startupProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30

      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-data
