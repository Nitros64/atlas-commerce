name: Terraform CI

on:
  pull_request:
    branches: [master]
    paths:
      - "platform/terraform/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [master]
    paths:
      - "platform/terraform/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  fmt:
    name: Terraform format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive platform/terraform

  validate:
    name: Validate ${{ matrix.root }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - platform/terraform/bootstrap/aws-backend
          - platform/terraform/live/aws/shared
          - platform/terraform/live/aws/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Initialize without backend or AWS access
        run: terraform -chdir="${{ matrix.root }}" init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir="${{ matrix.root }}" validate
