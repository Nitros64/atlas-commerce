name: Pricing Service CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - "services/pricing-service/**"
      - ".github/workflows/reusable-service-ci.yml"
  pull_request:
    branches: [master, main, develop]
    paths:
      - "services/pricing-service/**"
      - ".github/workflows/reusable-service-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and Test Pricing Service
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: Pricing Service
      service-path: services/pricing-service
      docker-image-name: pricing-service
    #secrets: inherit
