name: Order Service CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - "services/order-service/**"
      - ".github/workflows/reusable-service-ci.yml"
  pull_request:
    branches: [master, main, develop]
    paths:
      - "services/order-service/**"
      - ".github/workflows/reusable-service-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and Test Order Service
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: Order Service
      service-path: services/order-service
      docker-image-name: order-service
    #secrets: inherit
