inventory:
  enabled: true

  deployment:
    name: inventory
    replicas: 1
    image:
      repository: nitros64/inventory-service
      tag: "1.0.18"
      pullPolicy: Always
    containerPort: 8084
    terminationGracePeriodSeconds: 30

  labels:
    app: inventory
    tier: backend
    version: v1

  service:
    name: inventory-service
    type: ClusterIP
    port: 80
    targetPort: 8084

  javaToolOptions: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=35.0
    -XX:InitialRAMPercentage=8.0
    -XX:MaxMetaspaceSize=128m

  datasource:
    url: jdbc:postgresql://postgres-inventory:5432/inventorydb
    driverClassName: org.postgresql.Driver
    ddlAuto: update

  management:
    healthProbesEnabled: "true"
    healthShowDetails: always
    healthRedisEnabled: "false"
    healthRabbitEnabled: "false"
    healthKafkaEnabled: "false"

  otel:
    sdkDisabled: "true"
    tracesExporter: "none"
    metricsExporter: "none"
    logsExporter: "none"

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  probes:
    startup:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 45
    liveness:
      initialDelaySeconds: 180
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 5
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6

  networkPolicy:
    enabled: true
    allowedIngressApps:
      - gateway
      - order
      - prometheus