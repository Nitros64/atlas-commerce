name: Order Service CI

on:
  push:
    branches: ["master", "main", "develop" ]
    paths:
      - "services/order-service/**"
      - ".github/workflows/order-service-ci.yml"
  pull_request:
    branches: ["master", "main", "develop" ]
    paths:
      - "services/order-service/**"
      - ".github/workflows/order-service-ci.yml"

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test Order Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/order-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test with Maven
        run: mvn clean verify -B --no-transfer-progress

      - name: Build Docker image
        run: docker build -t order-service:ci .  

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Order Service Tests
          path: services/order-service/target/surefire-reports/*.xml
          reporter: java-junit