name: Platform CI

on:
  # Este workflow solo se activa cuando cambian Helm, Argo CD, sus scripts o el
  # CI que determina imágenes. No usa credenciales AWS ni accede a un cluster.
  pull_request:
    branches: [master]
    paths:
      - "platform/helm/**"
      - "platform/argocd/**"
      - "platform/terraform/live/aws/shared/terraform.tfvars.example"
      - "scripts/helm/**"
      - "scripts/argocd/**"
      - "scripts/gitops/**"
      - "scripts/smoke/**"
      - "scripts/aws/**"
      - ".github/workflows/*-service-ci.yml"
      - ".github/workflows/promote-dev-image.yml"
      - ".github/workflows/platform-ci.yml"
  push:
    branches: [master]
    paths:
      - "platform/helm/**"
      - "platform/argocd/**"
      - "platform/terraform/live/aws/shared/terraform.tfvars.example"
      - "scripts/helm/**"
      - "scripts/argocd/**"
      - "scripts/gitops/**"
      - "scripts/smoke/**"
      - "scripts/aws/**"
      - ".github/workflows/*-service-ci.yml"
      - ".github/workflows/promote-dev-image.yml"
      - ".github/workflows/platform-ci.yml"
  workflow_dispatch:

permissions:
  # Todas las validaciones son locales y solo necesitan leer el repositorio.
  contents: read

jobs:
  platform:
    name: Validate Helm and Argo CD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.18.4

      - name: Set up kubectl for offline Kustomize validation
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: v1.32.0

      - name: Validate base profile
        # Comprueba los defaults del chart y renderiza los manifests base.
        shell: bash
        run: |
          set -euo pipefail
          helm lint platform/helm/atlas-commerce
          helm template atlas platform/helm/atlas-commerce \
            -n atlas \
            --debug \
            > "$RUNNER_TEMP/atlas-base.yaml"

      - name: Validate local profile
        # En CI se sustituye el archivo local ignorado por Git por un fixture
        # ficticio y no sensible; el orden canónico de values lo conserva el script.
        shell: bash
        env:
          LOCAL_SECRETS_FILE: ${{ github.workspace }}/platform/helm/atlas-commerce/values/secrets-local.example.yaml
        run: |
          set -euo pipefail
          bash scripts/helm/template-local.sh \
            > "$RUNNER_TEMP/atlas-local.txt"

      - name: Validate dev profile
        # El script valida lint/template y la paridad de las doce imágenes entre
        # Helm, Terraform shared/ECR y los workflows de servicios.
        shell: bash
        run: bash scripts/helm/validate-dev.sh

      - name: Validate Argo CD DEV foundation
        shell: bash
        run: bash scripts/argocd/validate-argocd-dev.sh

      - name: Validate DEV image promotion contract
        shell: bash
        run: |
          python scripts/gitops/promote-dev-image.py \
            --service auth \
            --image-tag sha-0000000000000000000000000000000000000000-1-1 \
            --check

      - name: Validate platform shell syntax
        # Parsea los scripts sin ejecutar AWS, kubectl ni ningún cambio remoto.
        shell: bash
        run: bash -n scripts/aws/*.sh scripts/argocd/*.sh scripts/smoke/*.sh
