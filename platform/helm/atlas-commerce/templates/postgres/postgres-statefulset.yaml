{{- if .Values.postgres.enabled }}
{{- range $key, $db := .Values.postgres.instances }}
{{- if $db.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $db.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  serviceName: {{ $db.name }}-headless
  replicas: {{ $db.replicas }}
  minReadySeconds: 10
  selector:
    matchLabels:
      app: {{ $db.name }}
  template:
    metadata:
      labels:
        app: {{ $db.name }}
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: {{ $db.name }}
          image: "{{ $.Values.postgres.image.repository }}:{{ $.Values.postgres.image.tag }}"
          imagePullPolicy: {{ $.Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ $db.secretName }}
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $db.secretName }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $db.secretName }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: {{ $db.resources.requests.cpu | quote }}
              memory: {{ $db.resources.requests.memory | quote }}
            limits:
              cpu: {{ $db.resources.limits.cpu | quote }}
              memory: {{ $db.resources.limits.memory | quote }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U {{ $db.username }} -d {{ $db.database }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U {{ $db.username }} -d {{ $db.database }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ $.Values.postgres.defaultStorageClassName }}
        resources:
          requests:
            storage: {{ $db.storage }}
{{- end }}
{{- end }}
{{- end }}