kafka:
  enabled: true

  name: kafka
  configMapName: cm-kafka
  brokerConfigMapName: kafka-broker-config

  bootstrapServers: kafka:9092
  orderEventsTopic: order-events

  deployment:
    name: kafka
    replicas: 1
    image:
      repository: apache/kafka
      tag: "4.0.0"
      pullPolicy: IfNotPresent
    terminationGracePeriodSeconds: 90

  labels:
    app: kafka
    tier: messaging

  service:
    name: kafka
    type: ClusterIP
    brokerPort: 9092
    controllerPort: 9093

  pvc:
    name: kafka-data
    storageClassName: standard
    size: 10Gi

  security:
    fsGroup: 1000
    runAsUser: 1000
    runAsGroup: 1000

  initContainer:
    image:
      repository: busybox
      tag: "1.36"
      pullPolicy: IfNotPresent

  brokerConfig:
    nodeId: "1"
    processRoles: "broker,controller"
    controllerQuorumVoters: "1@localhost:9093"
    listeners: "PLAINTEXT://:9092,CONTROLLER://:9093"
    advertisedListeners: "PLAINTEXT://kafka:9092"
    controllerListenerNames: "CONTROLLER"
    interBrokerListenerName: "PLAINTEXT"
    logDirs: "/var/lib/kafka/data"
    heapOpts: "-Xms256M -Xmx512M"
    autoCreateTopicsEnable: "true"
    groupInitialRebalanceDelayMs: "0"
    logRetentionHours: "168"
    numPartitions: "3"
    defaultReplicationFactor: "1"
    minInsyncReplicas: "1"
    offsetsTopicReplicationFactor: "1"
    transactionStateLogReplicationFactor: "1"
    transactionStateLogMinIsr: "1"

  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "700m"
      memory: "900Mi"

  probes:
    startup:
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 30
    readiness:
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 20
      failureThreshold: 5