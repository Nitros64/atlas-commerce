apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-data
  namespace: atlas
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi     # Ajusta según tu necesidad (5-20Gi es común)
  # storageClassName: standard   # Descomenta si necesitas una StorageClass específica

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: atlas
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
      log_level: info

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    ingester:
      max_block_duration: 10m
      flush_check_period: 1m

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/traces
        block:
          bloom_filter_false_positive: 0.001
        #retention: 168h   # 7 días - ajústalo según necesites

    compactor:
      compaction:
        compaction_window: 1h
        max_block_bytes: 104857600

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: atlas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      securityContext:
        fsGroup: 10001      # ← Importante: grupo del usuario de Tempo        
        runAsUser: 10001
        runAsGroup: 10001
        fsGroupChangePolicy: "OnRootMismatch"

      initContainers:
        - name: chown-data
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /var/tempo/wal /var/tempo/traces && chown -R 10001:10001 /var/tempo"]
          volumeMounts:
            - name: tempo-data
              mountPath: /var/tempo
      containers:
        - name: tempo
          image: grafana/tempo:2.10.5
          args:
            - "-config.file=/etc/tempo/tempo.yaml"          
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"

          ports:
            - containerPort: 3200   # HTTP
            - containerPort: 4317   # OTLP gRPC
            - containerPort: 4318   # OTLP HTTP

          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: tempo-data
              mountPath: /var/tempo

          # Probes recomendadas
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 30
            periodSeconds: 30

      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: tempo-data
          persistentVolumeClaim:
            claimName: tempo-data
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: atlas
spec:
  selector:
    app: tempo
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318            