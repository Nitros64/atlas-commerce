auth:
  enabled: true

  deployment:
    name: auth
    replicas: 1
    image:
      repository: nitros64/auth-service
      tag: "1.0.15"
      pullPolicy: Always
    containerPort: 8081
    terminationGracePeriodSeconds: 30

  labels:
    app: auth
    tier: backend
    version: v1

  service:
    name: auth-service
    type: ClusterIP
    port: 80
    targetPort: 8081

  javaToolOptions: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=35.0
    -XX:InitialRAMPercentage=8.0
    -XX:MaxMetaspaceSize=128m

  datasource:
    url: jdbc:postgresql://postgres-auth:5432/authdb
    username: atlas
    password: atlas
    driverClassName: org.postgresql.Driver
    hikari:
      connectionTimeout: "3000"
      validationTimeout: "1000"
      idleTimeout: "30000"
      maxLifetime: "300000"
      maximumPoolSize: "10"
      minimumIdle: "2"

  jwt:
    secretName: jwt-secret
    expirationMs: "300000"
    refreshExpirationMs: "604800000"

  security:
    sessionMaxActive: "5"
    loginMaxAttempts: "5"
    loginWindowSeconds: "300"

  server:
    forwardHeadersStrategy: framework

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  probes:
    startup:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 30
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6

  pdb:
    enabled: true
    minAvailable: 1