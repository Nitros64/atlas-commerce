{{- if and (not .Values.postgres.enabled) .Values.postgres.bootstrap.enabled .Values.postgres.external.host .Values.postgres.bootstrap.adminSecret.remoteKey }}
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.postgres.bootstrap.backoffLimit | default 3 }}
  template:
    metadata:
      labels:
        app: postgres-bootstrap
    spec:
      serviceAccountName: postgres-bootstrap
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-bootstrap-secrets
          image: {{ .Values.postgres.bootstrap.secretWait.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WAIT_TIMEOUT_SECONDS
              value: {{ .Values.postgres.bootstrap.secretWait.timeoutSeconds | quote }}
            - name: WAIT_INTERVAL_SECONDS
              value: {{ .Values.postgres.bootstrap.secretWait.intervalSeconds | quote }}
          command:
            - sh
            - -ec
            - |
              api="https://kubernetes.default.svc"
              token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              ca="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

              wait_for_secret() {
                secret_name="$1"
                shift
                elapsed=0

                while [ "$elapsed" -lt "$WAIT_TIMEOUT_SECONDS" ]; do
                  response_file="/tmp/${secret_name}.json"
                  status="$(curl --silent --show-error \
                    --cacert "$ca" \
                    --header "Authorization: Bearer $token" \
                    --output "$response_file" \
                    --write-out '%{http_code}' \
                    "$api/api/v1/namespaces/$POD_NAMESPACE/secrets/$secret_name")"

                  if [ "$status" = "200" ]; then
                    missing_key=""
                    for key in "$@"; do
                      if ! grep -q "\"$key\":" "$response_file"; then
                        missing_key="$key"
                        break
                      fi
                    done

                    if [ -z "$missing_key" ]; then
                      echo "Secret $secret_name is ready"
                      return 0
                    fi

                    echo "Secret $secret_name exists but key $missing_key is missing"
                  elif [ "$status" != "404" ]; then
                    echo "ERROR: Kubernetes API returned HTTP $status for Secret $secret_name" >&2
                    cat "$response_file" >&2
                    return 1
                  else
                    echo "Waiting for Secret $secret_name"
                  fi

                  sleep "$WAIT_INTERVAL_SECONDS"
                  elapsed=$((elapsed + WAIT_INTERVAL_SECONDS))
                done

                echo "ERROR: Timed out waiting for Secret $secret_name after ${WAIT_TIMEOUT_SECONDS}s" >&2
                cat "/tmp/${secret_name}.json" >&2 2>/dev/null || true
                return 1
              }

              wait_for_secret {{ .Values.postgres.bootstrap.adminSecret.name | quote }} \
                POSTGRES_ADMIN_USER POSTGRES_ADMIN_PASSWORD
              wait_for_secret {{ .Values.postgres.bootstrap.appPasswordSecretName | quote }} \
                {{ .Values.postgres.bootstrap.appPasswordSecretKey | quote }}
      containers:
        - name: postgres-bootstrap
          image: {{ .Values.postgres.bootstrap.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.external.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.external.port | default 5432 | quote }}

            - name: POSTGRES_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.bootstrap.adminSecret.name }}
                  key: POSTGRES_ADMIN_USER

            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.bootstrap.adminSecret.name }}
                  key: POSTGRES_ADMIN_PASSWORD

            - name: APP_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.bootstrap.appPasswordSecretName }}
                  key: {{ .Values.postgres.bootstrap.appPasswordSecretKey }}

          command:
            - sh
            - -c
            - |
              set -eu

              export PGPASSWORD="$POSTGRES_ADMIN_PASSWORD"

              APP_PASSWORD_ESCAPED="$(printf "%s" "$APP_POSTGRES_PASSWORD" | sed "s/'/''/g")"

              psql_admin() {
                psql \
                  -h "$POSTGRES_HOST" \
                  -p "$POSTGRES_PORT" \
                  -U "$POSTGRES_ADMIN_USER" \
                  -d postgres \
                  -v ON_ERROR_STOP=1 \
                  "$@"
              }

                    create_role() {
                      ROLE_NAME="$1"

                      if psql_admin -tAc "SELECT 1 FROM pg_roles WHERE rolname='${ROLE_NAME}'" | grep -q 1; then
                        echo "Role ${ROLE_NAME} already exists"
                      else
                        echo "Creating role ${ROLE_NAME}"
                        psql_admin -c "CREATE ROLE \"${ROLE_NAME}\" LOGIN PASSWORD '${APP_PASSWORD_ESCAPED}'"
                      fi

                      echo "Granting role ${ROLE_NAME} to admin user ${POSTGRES_ADMIN_USER}"
                      psql_admin -c "GRANT \"${ROLE_NAME}\" TO \"${POSTGRES_ADMIN_USER}\""
                    }

              create_database() {
                DB_NAME="$1"
                OWNER_NAME="$2"

                if psql_admin -tAc "SELECT 1 FROM pg_database WHERE datname='${DB_NAME}'" | grep -q 1; then
                  echo "Database ${DB_NAME} already exists"
                else
                  echo "Creating database ${DB_NAME} owned by ${OWNER_NAME}"
                  psql_admin -c "CREATE DATABASE \"${DB_NAME}\" OWNER \"${OWNER_NAME}\""
                fi

                psql \
                  -h "$POSTGRES_HOST" \
                  -p "$POSTGRES_PORT" \
                  -U "$POSTGRES_ADMIN_USER" \
                  -d "$DB_NAME" \
                  -v ON_ERROR_STOP=1 \
                  -c "GRANT ALL PRIVILEGES ON DATABASE \"${DB_NAME}\" TO \"${OWNER_NAME}\"" \
                  -c "GRANT ALL ON SCHEMA public TO \"${OWNER_NAME}\"" \
                  -c "ALTER SCHEMA public OWNER TO \"${OWNER_NAME}\""
              }

              {{- range $key, $db := .Values.postgres.instances }}
              {{- if $db.enabled }}
              create_role {{ $db.username | quote }}
              create_database {{ $db.database | quote }} {{ $db.username | quote }}
              {{- end }}
              {{- end }}

              echo "PostgreSQL bootstrap completed"
{{- end }}
