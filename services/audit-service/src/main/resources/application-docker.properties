server.port=${SERVER_PORT:8093}

security.jwt.secret=${SECURITY_JWT_SECRET}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

management.health.redis.enabled=false
management.health.rabbit.enabled=false
management.health.kafka.enabled=false


#Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

spring.kafka.consumer.group-id=audit-service-v1
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

atlas.kafka.topics.order-events=${ORDER_EVENTS_TOPIC:order-events}
atlas.kafka.topics.inventory-events=${INVENTORY_EVENTS_TOPIC:inventory-events}
atlas.kafka.topics.payment-events=${PAYMENT_EVENTS_TOPIC:payment-events}
atlas.kafka.topics.shipping-events=${SHIPPING_EVENTS_TOPIC:shipping-events}

logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN