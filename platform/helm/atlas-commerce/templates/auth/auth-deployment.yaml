{{- if .Values.auth.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.auth.deployment.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app: {{ .Values.auth.labels.app }}
    tier: {{ .Values.auth.labels.tier }}
    version: {{ .Values.auth.labels.version }}
spec:
  replicas: {{ .Values.auth.deployment.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ .Values.auth.labels.app }}
  template:
    metadata:
      annotations:
        checksum/config-auth: {{ include (print $.Template.BasePath "/auth/configmap-auth.yaml") . | sha256sum }}
        checksum/config-datasource: {{ include (print $.Template.BasePath "/auth/configmap-datasource.yaml") . | sha256sum }}
        checksum/config-redis: {{ include (print $.Template.BasePath "/redis/cm-redis.yaml") . | sha256sum }}
      labels:
        app: {{ .Values.auth.labels.app }}
        tier: {{ .Values.auth.labels.tier }}
        version: {{ .Values.auth.labels.version }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.auth.deployment.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Values.auth.labels.app }}
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.auth.deployment.image.repository }}:{{ .Values.auth.deployment.image.tag }}"
          imagePullPolicy: {{ .Values.auth.deployment.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.auth.deployment.containerPort }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.auth.javaToolOptions | quote }}
            
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.instances.auth.secretName }}
                  key: POSTGRES_PASSWORD  
                  
          envFrom:
            - configMapRef:
                name: cm-auth-spring-datasource
            - configMapRef:
                name: cm-redis
            - configMapRef:
                name: cm-auth
            - secretRef:
                name: {{ .Values.auth.jwt.secretName }}
            - secretRef:
                name: redis-secret
          
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          
          resources:
            requests:
              cpu: {{ .Values.auth.resources.requests.cpu | quote }}
              memory: {{ .Values.auth.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.auth.resources.limits.cpu | quote }}
              memory: {{ .Values.auth.resources.limits.memory | quote }}
          
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.auth.deployment.containerPort }}
            initialDelaySeconds: {{ .Values.auth.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.auth.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.auth.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.auth.probes.startup.failureThreshold }}
          
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.auth.deployment.containerPort }}
            initialDelaySeconds: {{ .Values.auth.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.auth.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.auth.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.auth.probes.liveness.failureThreshold }}
          
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.auth.deployment.containerPort }}
            initialDelaySeconds: {{ .Values.auth.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.auth.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.auth.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.auth.probes.readiness.failureThreshold }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
{{- end }}
