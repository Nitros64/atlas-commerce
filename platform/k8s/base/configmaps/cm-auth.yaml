apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-auth
  namespace: atlas
data:
  SPRING_PROFILES_ACTIVE: "docker"
  SECURITY_JWT_EXPIRATION_MS: "300000"
  SECURITY_JWT_REFRESH_EXPIRATION_MS: "604800000"
  SECURITY_SESSION_MAX_ACTIVE: "5"
  SECURITY_RATE_LIMIT_LOGIN_MAX_ATTEMPTS: "5"
  SECURITY_RATE_LIMIT_LOGIN_WINDOW_SECONDS: "300"
  SERVER_FORWARD_HEADERS_STRATEGY: "framework"
