# # Shared connection from Kubernetes External Secrets Operator to AWS Secrets Manager.
# apiVersion: external-secrets.io/v1
# kind: ClusterSecretStore
# metadata:
#   name: atlas-aws-secretsmanager
# spec:
#   provider:
#     aws:
#       # Use AWS Secrets Manager as the external provider.
#       service: SecretsManager

#       # Atlas AWS infrastructure lives in Frankfurt.
#       region: eu-central-1

#       # Obtain temporary AWS credentials through the ESO ServiceAccount IRSA role.
#       auth:
#         jwt:
#           serviceAccountRef:
#             name: external-secrets
#             namespace: external-secrets

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: atlas-aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1