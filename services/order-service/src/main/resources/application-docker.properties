spring.application.name=order-service
server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
#spring.data.redis.database=0

# Lettuce Pool Configuration
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=2000ms

# Redis Timeout
spring.data.redis.timeout=2000ms

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Security Configuration
security.jwt.secret=${SECURITY_JWT_SECRET}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.prometheus.access=unrestricted

# Disable unused health indicators
management.health.rabbit.enabled=false 

# RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq-svc}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:atlas}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:atlas}
app.rabbitmq.exchange=atlas.orders.exchange
app.rabbitmq.routing-key=orders.created

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
atlas.kafka.topics.order-events=${ORDER_EVENTS_TOPIC:order-events}
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.producer.properties.request.timeout.ms=1000
spring.kafka.producer.properties.delivery.timeout.ms=3000
spring.kafka.producer.properties.retries=0

spring.kafka.consumer.group-id=order-service-saga-v1
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

atlas.kafka.topics.inventory-events=${INVENTORY_EVENTS_TOPIC:inventory-events}
atlas.kafka.topics.payment-events=${PAYMENT_EVENTS_TOPIC:payment-events}
atlas.kafka.topics.shipping-events=${SHIPPING_EVENTS_TOPIC:shipping-events}

atlas.kafka.topics.inventory-events-dlt=${INVENTORY_EVENTS_DLT_TOPIC:inventory-events.DLT}
atlas.kafka.topics.payment-events-dlt=${PAYMENT_EVENTS_DLT_TOPIC:payment-events.DLT}
atlas.kafka.topics.shipping-events-dlt=${SHIPPING_EVENTS_DLT_TOPIC:shipping-events.DLT}

# Logging Configuration
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF


logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] [%thread] %logger{36} - %msg%n

# OpenTelemetry Configuration
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://tempo:4318/v1/traces
management.opentelemetry.resource-attributes.service.namespace=atlas
management.opentelemetry.resource-attributes.service.name=order-service
management.otlp.metrics.export.enabled=false
management.metrics.export.otlp.enabled=false

# Resilience4j - RabbitMQ secondary publisher
resilience4j.circuitbreaker.instances.rabbitOrderPublisher.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.rabbitOrderPublisher.sliding-window-size=5
resilience4j.circuitbreaker.instances.rabbitOrderPublisher.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.rabbitOrderPublisher.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.rabbitOrderPublisher.permitted-number-of-calls-in-half-open-state=2

resilience4j.retry.instances.rabbitOrderPublisher.max-attempts=2
resilience4j.retry.instances.rabbitOrderPublisher.wait-duration=500ms

# Resilience4j - Kafka primary publisher
resilience4j.circuitbreaker.instances.orderKafkaPublisher.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderKafkaPublisher.sliding-window-size=5
resilience4j.circuitbreaker.instances.orderKafkaPublisher.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.orderKafkaPublisher.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.orderKafkaPublisher.permitted-number-of-calls-in-half-open-state=2

resilience4j.retry.instances.orderKafkaPublisher.max-attempts=2
resilience4j.retry.instances.orderKafkaPublisher.wait-duration=500ms