{{- if and .Values.secretManagement.externalSecrets.enabled .Values.postgres.bootstrap.enabled .Values.postgres.bootstrap.adminSecret.remoteKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.bootstrap.adminSecret.name }}-external
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: {{ .Values.secretManagement.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.secretManagement.externalSecrets.secretStore.name }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.postgres.bootstrap.adminSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_ADMIN_USER
      remoteRef:
        key: {{ .Values.postgres.bootstrap.adminSecret.remoteKey | quote }}
        property: {{ .Values.postgres.bootstrap.adminSecret.usernameProperty | quote }}
    - secretKey: POSTGRES_ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.postgres.bootstrap.adminSecret.remoteKey | quote }}
        property: {{ .Values.postgres.bootstrap.adminSecret.passwordProperty | quote }}
{{- end }}
