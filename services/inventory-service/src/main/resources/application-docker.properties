server.port=8084

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

security.jwt.secret=${SECURITY_JWT_SECRET}

management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

management.health.redis.enabled=false
management.health.rabbit.enabled=false
management.health.kafka.enabled=true

#spring.jackson.serialization.write-dates-as-timestamps=false


# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

spring.kafka.consumer.group-id=inventory-service-v10
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.listener.missing-topics-fatal=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.reconnect.backoff.ms=1000
spring.kafka.consumer.properties.reconnect.backoff.max.ms=10000

spring.kafka.consumer.properties.spring.json.value.default.type=com.atlascommerce.inventory_service.event.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*

atlas.kafka.topics.order-events=${ORDER_EVENTS_TOPIC:order-events}
atlas.kafka.topics.inventory-events=${INVENTORY_EVENTS_TOPIC:inventory-events}


logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# OpenTelemetry Configuration
management.tracing.sampling.probability=1.0

management.opentelemetry.tracing.export.otlp.endpoint=http://tempo:4318/v1/traces

management.opentelemetry.resource-attributes.service.namespace=atlas
management.opentelemetry.resource-attributes.service.name=inventory-service

# Resilience4j Configuration for Kafka publisher
resilience4j.circuitbreaker.instances.inventoryKafkaPublisher.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryKafkaPublisher.sliding-window-size=5
resilience4j.circuitbreaker.instances.inventoryKafkaPublisher.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.inventoryKafkaPublisher.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.inventoryKafkaPublisher.permitted-number-of-calls-in-half-open-state=2

resilience4j.retry.instances.inventoryKafkaPublisher.max-attempts=2
resilience4j.retry.instances.inventoryKafkaPublisher.wait-duration=500ms