spring.application.name=payment-service
server.port=${SERVER_PORT:8088}

# Security
security.jwt.secret=${SECURITY_JWT_SECRET:dev-local-secret-change-me}

# Postgres - Local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/paymentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:atlas}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:atlas}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

management.health.redis.enabled=false
management.health.rabbit.enabled=false
management.health.kafka.enabled=true

# Kafka - Local
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=payment-service-local
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

atlas.kafka.topics.inventory-events=${INVENTORY_EVENTS_TOPIC:inventory-events}
atlas.kafka.topics.payment-events=${PAYMENT_EVENTS_TOPIC:payment-events}

# Logging
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# OpenTelemetry - Disabled locally
management.tracing.sampling.probability=0.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.timeout=30s

management.opentelemetry.resource-attributes.service.namespace=atlas-local
management.opentelemetry.resource-attributes.service.name=payment-service

management.otlp.metrics.export.enabled=false
management.metrics.export.otlp.enabled=false

# Resilience4j
resilience4j.circuitbreaker.instances.paymentKafkaPublisher.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentKafkaPublisher.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentKafkaPublisher.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.paymentKafkaPublisher.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.paymentKafkaPublisher.permitted-number-of-calls-in-half-open-state=2

resilience4j.retry.instances.paymentKafkaPublisher.max-attempts=2
resilience4j.retry.instances.paymentKafkaPublisher.wait-duration=500ms