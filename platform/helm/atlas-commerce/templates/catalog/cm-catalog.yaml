{{- if .Values.catalog.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-catalog
  namespace: {{ .Release.Namespace }}
data:
  SPRING_PROFILES_ACTIVE: "docker"
  SPRING_DATASOURCE_URL: {{ .Values.catalog.datasource.url | quote }}
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: {{ .Values.catalog.datasource.driverClassName | quote }}
  SPRING_DATA_REDIS_HOST: {{ default .Values.catalog.redis.host .Values.redis.external.host | quote }}
  SPRING_DATA_REDIS_PORT: {{ .Values.catalog.redis.port | quote }}
  SPRING_DATA_REDIS_SSL_ENABLED: {{ .Values.redis.external.sslEnabled | default false | quote }}
{{- end }}