name: Coupon Service CI

on:
  push:
    branches: [master, "main", "develop"]
    paths:
      - "services/coupon-service/**"
      - ".github/workflows/coupon-service-ci.yml"
  pull_request:
    branches: ["master", "main", "develop"]
    paths:
      - "services/coupon-service/**"
      - ".github/workflows/coupon-service-ci.yml"

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test Coupon Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/coupon-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test with Maven
        run: mvn clean verify -B --no-transfer-progress

      - name: Build Docker image
        run: docker build -t coupon-service:ci .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: |
          docker tag coupon-service:ci ${{ secrets.DOCKERHUB_USERNAME }}/coupon-service:${{ github.sha }}
          docker tag coupon-service:ci ${{ secrets.DOCKERHUB_USERNAME }}/coupon-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/coupon-service:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/coupon-service:latest

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Coupon Service Tests
          path: services/coupon-service/target/surefire-reports/*.xml
          reporter: java-junit