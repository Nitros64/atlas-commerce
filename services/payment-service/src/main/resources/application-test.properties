spring.application.name=payment-service
server.port=8088

security.jwt.secret=test-secret-test-secret-test-secret-test-secret

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false


spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=payment-service-v1
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

atlas.kafka.topics.inventory-events=${INVENTORY_EVENTS_TOPIC:inventory-events}
atlas.kafka.topics.payment-events=${PAYMENT_EVENTS_TOPIC:payment-events}

logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN