server:
  port: 8080

spring:
  application:
    name: gateway-service

  data:
    redis:
      host: redis
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://auth-service
              predicates:
                - Path=/api/v1/auth/**

            - id: catalog-service
              uri: http://catalog-service
              predicates:
                - Path=/api/v1/catalog/**

            - id: order-service
              uri: http://order-service
              predicates:
                - Path=/api/v1/orders/**

logging:
  level:
    org.springframework.cloud.gateway: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  health:
    probes:
      enabled: true