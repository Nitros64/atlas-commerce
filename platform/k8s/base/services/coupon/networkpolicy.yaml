apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coupon-service-netpol
  namespace: atlas
spec:
  podSelector:
    matchLabels:
      app: coupon
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas
      ports:
        - protocol: TCP
          port: 8087
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres-coupon
      ports:
        - protocol: TCP
          port: 5432

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53